<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de tienda · KODELO</title>
  <link rel="icon" href="/img/kody.svg" type="image/svg+xml">
  <script src="/js/tema-inicial.js"></script>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/admin.css">
  <script type="module" src="/js/admin-tienda.js"></script>
</head>
<body>
  <div class="app">
    <nav class="lateral" aria-label="Menú principal">
      <a class="marca" href="/inicio">
        <span class="marca__logo" aria-hidden="true">&lt;/&gt;</span>
        <span class="marca__texto">KODELO</span>
      </a>
      <ul class="navegacion">
        <li><a class="nav__enlace" href="/inicio"><span class="icono icono--inicio" aria-hidden="true"></span><span class="nav__texto">Inicio</span></a></li>
        <li><button class="nav__enlace nav__enlace--pronto" type="button" aria-disabled="true" data-seccion="El perfil"><span class="icono icono--perfil" aria-hidden="true"></span><span class="nav__texto">Perfil</span><span class="nav__etiqueta-pronto">Pronto</span></button></li>
        <li><button class="nav__enlace nav__enlace--pronto" type="button" aria-disabled="true" data-seccion="El chat con KODY"><img src="/img/kody.svg" width="24" height="24" alt="" class="nav__kody"><span class="nav__texto">KODY</span><span class="nav__etiqueta-pronto">Pronto</span></button></li>
        <li><a class="nav__enlace" href="/tienda"><span class="icono icono--tienda" aria-hidden="true"></span><span class="nav__texto">Tienda</span></a></li>
        <li><button class="nav__enlace nav__enlace--pronto" type="button" aria-disabled="true" data-seccion="El ranking"><span class="icono icono--ranking" aria-hidden="true"></span><span class="nav__texto">Ranking</span><span class="nav__etiqueta-pronto">Pronto</span></button></li>
        <li><button class="nav__enlace nav__enlace--pronto" type="button" aria-disabled="true" data-seccion="El historial"><span class="icono icono--historial" aria-hidden="true"></span><span class="nav__texto">Historial</span><span class="nav__etiqueta-pronto">Pronto</span></button></li>
        <li><button class="nav__enlace nav__enlace--pronto" type="button" aria-disabled="true" data-seccion="El modo práctica"><span class="icono icono--practica" aria-hidden="true"></span><span class="nav__texto">Práctica</span><span class="nav__etiqueta-pronto">Pronto</span></button></li>
      </ul>
      <ul class="lateral__pie">
        <li><button class="nav__enlace nav__enlace--tema" type="button" id="boton-tema"><span class="icono icono--luna" aria-hidden="true"></span><span class="nav__texto">Modo oscuro</span></button></li>
        <li><button class="nav__enlace" type="button" id="boton-salir"><span class="icono icono--salir" aria-hidden="true"></span><span class="nav__texto">Cerrar sesión</span></button></li>
      </ul>
    </nav>

    <main class="contenido">
      <header class="cabecera-pagina cabecera-pagina--admin">
        <div>
          <h1 class="cabecera-pagina__titulo">Gestión de tienda</h1>
          <p class="cabecera-pagina__subtitulo">Crea productos, cambia precios y decide qué está a la venta</p>
        </div>
        <div class="cabecera-pagina__acciones">
          <span class="rol-actual" id="rol-actual">—</span>
          <span class="avatar-inicial" id="avatar" aria-hidden="true">?</span>
        </div>
      </header>

      <section class="estadisticas-admin" id="estadisticas" aria-label="Resumen"></section>

      <div class="herramientas">
        <label class="herramientas__buscar">
          <span class="oculto-accesible">Buscar producto</span>
          <span class="icono icono--buscar" aria-hidden="true"></span>
          <input class="campo__entrada" type="search" id="buscar" placeholder="Buscar producto" autocomplete="off">
        </label>
        <label>
          <span class="oculto-accesible">Filtrar por categoría</span>
          <select class="campo__entrada" id="filtro-tipo"><option value="">Todas las categorías</option><option value="AVATAR">Avatares</option><option value="MARCO">Marcos</option><option value="TEMA_EDITOR">Temas del editor</option><option value="FONDO">Fondos</option></select>
        </label>
        <label>
          <span class="oculto-accesible">Filtrar por estado</span>
          <select class="campo__entrada" id="filtro-estado"><option value="">Todos</option><option value="1">A la venta</option><option value="0">Retirados</option></select>
        </label>
        <button class="boton boton--principal boton--pequeno herramientas__nuevo" type="button" id="boton-nuevo"><span class="icono icono--mas" aria-hidden="true"></span>Nuevo producto</button>
      </div>

      <div class="tabla-contenedor" id="tabla" aria-live="polite">
        <div class="estado-admin estado-admin--carga">Cargando productos…</div>
      </div>
    </main>
  </div>
  <dialog class="dialogo" id="dialogo-item" aria-labelledby="dialogo-item-titulo">
    <form novalidate>
      <div class="dialogo__cabecera">
        <h2 class="dialogo__titulo" id="dialogo-item-titulo">Nuevo producto</h2>
      </div>
      <div class="dialogo__cuerpo">
        <div class="campo">
          <label class="campo__etiqueta" for="item-nombre">Nombre</label>
          <input class="campo__entrada" id="item-nombre" name="item-nombre" maxlength="60" autocomplete="off" autofocus>
          <span class="campo__contador" data-contador="item-nombre">0 / 60</span>
        </div>
        <div class="fila-campos">
          <div class="campo">
            <label class="campo__etiqueta" for="item-tipo">Categoría</label>
            <select class="campo__entrada" id="item-tipo"><option value="AVATAR">Avatar</option><option value="MARCO">Marco</option><option value="TEMA_EDITOR">Tema del editor</option><option value="FONDO">Fondo</option></select>
          </div>
          <div class="campo">
            <label class="campo__etiqueta" for="item-rareza">Rareza</label>
            <select class="campo__entrada" id="item-rareza"><option value="COMUN">Común</option><option value="RARO">Raro</option><option value="EPICO">Épico</option><option value="LEGENDARIO">Legendario</option></select>
          </div>
          <div class="campo">
            <label class="campo__etiqueta" for="item-precio">Precio (monedas)</label>
            <input class="campo__entrada" id="item-precio" type="number" min="0" max="100000" step="10" inputmode="numeric">
          </div>
        </div>
        <div class="campo">
          <label class="campo__etiqueta" for="item-descripcion">Descripción</label>
          <textarea class="campo__entrada" id="item-descripcion" name="item-descripcion" maxlength="140" rows="3" ></textarea>
          <span class="campo__contador" data-contador="item-descripcion">0 / 140</span>
        </div>
        <div class="campo">
          <label class="campo__etiqueta" for="item-imagen">Imagen</label>
          <select class="campo__entrada" id="item-imagen"></select>
        </div>
        <label class="interruptor"><input type="checkbox" id="item-activo"><span class="interruptor__pista" aria-hidden="true"></span>A la venta</label>
        <div class="vista-previa" id="vista-previa" aria-label="Vista previa"></div>
        <p class="aviso aviso--error dialogo__error" role="alert" hidden></p>
      </div>
      <div class="dialogo__pie">
        <button class="boton boton--secundario boton--pequeno" type="button" data-cerrar>Cancelar</button>
        <button class="boton boton--principal boton--pequeno" type="submit">Guardar producto</button>
      </div>
    </form>
  </dialog>
  <dialog class="dialogo" id="dialogo-confirmar" aria-labelledby="confirmar-titulo">
    <form method="dialog">
      <div class="dialogo__cabecera">
        <h2 class="dialogo__titulo" id="confirmar-titulo"></h2>
        <p class="dialogo__texto"></p>
      </div>
      <div class="dialogo__pie">
        <button class="boton boton--secundario boton--pequeno" value="no">Cancelar</button>
        <button class="boton boton--pequeno boton--peligro" type="submit" value="si">Eliminar</button>
      </div>
    </form>
  </dialog>
</body>
</html>
